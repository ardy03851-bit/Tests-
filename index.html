<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Suction Studio">
  <meta name="description" content="Suction Studio — a touch-first cut-out puppet animator for iPad. Rig PNG parts, keyframe transforms, add sound and export high-quality animation.">
  <title>Suction Studio — Puppet Animator</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff8a3d' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M5 10.5a7 7 0 0 1 14 0v1.8a7 7 0 0 1-14 0v-1.8z'/%3E%3Cpath d='M12 19.5V22'/%3E%3Ccircle cx='12' cy='10.5' r='2.6'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <div class="brand-mark" data-icon="logo" data-icon-size="24"></div>
        <div class="brand-text">
          <span class="brand-name">SUCTION</span>
          <span class="brand-sub">STUDIO</span>
        </div>
      </div>
      <div class="tb-group">
        <button class="btn icon" id="btnFile" data-icon="folder" title="File"></button>
        <button class="btn icon" id="btnUndo" data-icon="undo" title="Undo (⌘Z)"></button>
        <button class="btn icon" id="btnRedo" data-icon="redo" title="Redo (⇧⌘Z)"></button>
      </div>
      <div class="tb-center">
        <button class="project-name" id="btnProjectName" title="Rename project">Untitled Scene</button>
        <span class="tb-sep"></span>
        <span class="timecode" id="tcTop">F 000 · 0.00s</span>
      </div>
      <div class="tb-group right">
        <button class="btn" id="btnAssets" data-icon="image" title="Asset library"><span>Assets</span></button>
        <button class="btn icon" id="btnSettings" data-icon="settings" title="Project settings"></button>
        <button class="btn primary" id="btnExport" data-icon="download" title="Export"><span>Export</span></button>
      </div>
    </header>

    <div id="main">
      <nav id="rail" aria-label="Tools"></nav>

      <div id="stageWrap">
        <canvas id="stage"></canvas>
        <div id="stageHud">
          <button class="hud-btn" id="hudZoomOut" data-icon="zoom-out" title="Zoom out"></button>
          <span class="hud-zoom" id="hudZoom">100%</span>
          <button class="hud-btn" id="hudZoomIn" data-icon="zoom-in" title="Zoom in"></button>
          <button class="hud-btn" id="hudFit" data-icon="fit" title="Fit to screen"></button>
          <span class="hud-sep"></span>
          <button class="hud-btn" id="hudGrid" data-icon="grid" title="Grid (G)"></button>
          <button class="hud-btn" id="hudOnion" data-icon="onion" title="Onion skin (O)"></button>
          <button class="hud-btn" id="hudProps" data-icon="sliders" title="Inspector"></button>
        </div>
        <div id="stageBadge">1920 × 1080 · 24 fps</div>
        <div id="stageTip">Drag a part to pose it · pinch to zoom · two fingers to pan</div>
      </div>

      <aside id="props" aria-label="Inspector"></aside>
    </div>

    <section id="timeline" aria-label="Timeline">
      <div id="tlResize" title="Drag to resize timeline"></div>
      <div id="tlToolbar">
        <div class="tl-group">
          <button class="tbtn" id="btnAddLayer" data-icon="plus" title="Add layer"></button>
          <button class="tbtn" id="btnDuplicate" data-icon="copy" title="Duplicate"></button>
          <button class="tbtn" id="btnDelete" data-icon="trash" title="Delete"></button>
        </div>
        <div class="tl-transport">
          <button class="tbtn" id="btnToStart" data-icon="skip-start" title="Go to start"></button>
          <button class="tbtn" id="btnPrev" data-icon="step-back" title="Previous frame (←)"></button>
          <button class="tbtn play" id="btnPlay" data-icon="play" title="Play / pause (Space)"></button>
          <button class="tbtn" id="btnNext" data-icon="step-fwd" title="Next frame (→)"></button>
          <button class="tbtn" id="btnToEnd" data-icon="skip-end" title="Go to end"></button>
          <button class="tbtn" id="btnLoop" data-icon="loop" title="Loop playback"></button>
        </div>
        <div class="tl-time">
          <span id="tcFrames">F 000</span><span class="tc-sep">/</span><span id="tcTotal">096</span>
          <span id="tcSeconds">0.00s</span>
        </div>
        <div class="tl-group right">
          <button class="tbtn toggle" id="btnAutoKey" data-icon="keyPlus" title="Auto-key"></button>
          <button class="tbtn toggle" id="btnOnion" data-icon="onion" title="Onion skin"></button>
          <button class="tbtn toggle" id="btnSnap" data-icon="magnet" title="Snap to frames"></button>
          <span class="hud-sep"></span>
          <button class="tbtn" id="tlZoomOut" data-icon="zoom-out" title="Timeline zoom out"></button>
          <button class="tbtn" id="tlZoomIn" data-icon="zoom-in" title="Timeline zoom in"></button>
          <button class="tbtn" id="tlFit" data-icon="fit" title="Fit timeline"></button>
        </div>
      </div>
      <div id="tlMain">
        <div id="tlScroll">
          <div id="tlContent">
            <div id="tlRuler"></div>
            <div id="tlRows"></div>
            <div id="tlPlayhead"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="toasts"></div>
  <div id="modalRoot"></div>
  <div id="menuRoot"></div>

  <script src="js/util.js"></script>
  <script src="js/model.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/export.js"></script>
  <script src="js/default-project.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
